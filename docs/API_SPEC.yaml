      type: object
      required: [decision, resolution_note]
      properties:
        decision:
          type: string
          enum: [KEEP_EXISTING, APPLY_INCOMING_REFERENCE, DISMISS]
          description: APPLY_INCOMING_REFERENCE is valid only for reference mappings and applies validated values from the immutable preview row.
        expected_existing_value_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Required for APPLY_INCOMING_REFERENCE; must match the existing mapping value at decision time.
        resolution_note:
          type: string
          minLength: 1
          maxLength: 2000
      allOf:
        - if:
            properties:
              decision:
                const: APPLY_INCOMING_REFERENCE
            required: [decision]
          then:
            properties:
              expected_existing_value_hash:
                type: string
                pattern: '^[0-9a-f]{64}$'
            required: [expected_existing_value_hash]
      additionalProperties: false
