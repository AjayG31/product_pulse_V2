        default:
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-productpulse_session
      description: Opaque server-side cookie; Secure, HttpOnly, SameSite=Lax, Path=/, no Domain. Idle expiry is 30 minutes and absolute expiry is 8 hours.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Session-bound CSRF token required on every cookie-authenticated mutation; returned only in the explicit bootstrap/login/session/password-change flow.
  parameters:
    CsrfTokenHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: Required on login and authenticated state-changing requests. Login also requires the matching pre-login CSRF cookie and exact same-origin Origin/Referer validation.
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable key for retryable commands. Same key and same request replays the original result; same key with different request returns 409 idempotency_conflict.
      schema:
        type: string
        minLength: 8
        maxLength: 200
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    SortOrder:
      name: sort_order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    FromUtc:
      name: from_utc
      in: query
      description: Inclusive UTC event-time lower bound, RFC 3339 date-time.
      schema:
        type: string
        format: date-time
    ToUtc:
      name: to_utc
      in: query
      description: Exclusive UTC event-time upper bound, RFC 3339 date-time.
      schema:
        type: string
        format: date-time
    ProductIdFilter:
      name: product_id
      in: query
      schema:
        type: string
        maxLength: 200
    CategoryCodeFilter:
      name: category_code
      in: query
      schema:
        type: string
        maxLength: 100
    SupplierIdFilter:
      name: supplier_id
      in: query
      schema:
        type: string
        maxLength: 200
    BatchIdFilter:
      name: batch_id
      in: query
      schema:
        type: string
        maxLength: 200
    LogicalDefectIdFilter:
      name: logical_defect_id
      in: query
      schema:
        type: string
        maxLength: 200
    SeverityFilter:
      name: severity
      in: query
      schema:
        $ref: '#/components/schemas/IncidentSeverity'
    IncidentStatusFilter:
      name: incident_status
      in: query
      schema:
        $ref: '#/components/schemas/IncidentStatus'
    SourceTypeFilter:
      name: source_type
      in: query
      schema:
        $ref: '#/components/schemas/SourceType'
    ProductIdPath:
      name: product_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    FeedbackIdPath:
      name: feedback_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    IncidentIdPath:
      name: incident_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    NotificationIdPath:
      name: notification_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    PreviewIdPath:
      name: preview_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    IngestionJobIdPath:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    BackgroundJobIdPath:
      name: background_job_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    ConflictIdPath:
      name: conflict_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    TaxonomyVersionIdPath:
      name: taxonomy_version_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    RuleVersionPath:
      name: rule_version
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    RecipientIdPath:
      name: recipient_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    RecipientGroupIdPath:
      name: recipient_group_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    NotificationRuleIdPath:
      name: notification_rule_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    UserIdPath:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
  responses:
    BadRequest:
      description: Malformed request or invalid filter combination.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
          example:
            type: about:blank
            title: Bad request
            status: 400
            code: invalid_request
            detail: The request could not be parsed.
            request_id: req_01
    Unauthorized:
      description: Missing, expired, revoked, or invalid session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            code: authentication_required
            detail: Sign in to use this endpoint.
            request_id: req_02
    Forbidden:
      description: Principal lacks the required role. For an Admin-only upload call, no file, preview, or job is created.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            code: role_forbidden
            detail: This operation requires the ADMIN role.
            request_id: req_03
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    Conflict:
      description: State, hash, idempotency, or concurrency conflict.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
          examples:
            stale_state:
              summary: Concurrent update
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: stale_incident_state
                detail: Reload the incident before retrying the transition.
                request_id: req_04
            preview_hash:
              summary: Hash mismatch
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: preview_hash_mismatch
                detail: The supplied hash does not match the immutable preview.
                request_id: req_05
            idempotency:
              summary: Key reused with a different command
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: idempotency_conflict
                detail: Use a new key for a different request.
                request_id: req_06
    PayloadTooLarge:
      description: CSV file-part exceeds the inclusive 20,000,000-byte decimal 20 MB limit, checked while streaming before parsing.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    UnsupportedMediaType:
      description: Unsupported upload extension or media type.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    ValidationError:
      description: Request validation failure. Parseable CSV row errors are returned in the preview instead.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
          example:
            type: about:blank
            title: Validation error
            status: 422
            code: validation_error
            detail: One or more request fields are invalid.
            request_id: req_07
            errors:
              - field: to_utc
                code: invalid_range
                message: to_utc must be later than from_utc.
    RateLimited:
      description: Login rate limit exceeded; account/IP limits are documented in x-authentication-contract. Other route rate limits remain open. Retry-After is included.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 0
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    ServiceUnavailable:
      description: Temporary service or artifact-integrity failure. No secret, filesystem path, or provider payload is returned.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    InternalServerError:
      description: Unexpected internal failure. The response is generic and redacted; internal exception details are not returned. This reusable response is also used as each operation's default error response.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
          example:
            type: about:blank
            title: Internal server error
            status: 500
            code: internal_error
            detail: The request could not be completed.
            request_id: req_500
  schemas:
    UserRole:
      type: string
      enum: [ADMIN, BUSINESS_USER]
    UserStatus:
      type: string
      enum: [ACTIVE, DEACTIVATED]
    SourceType:
      type: string
      enum: [REVIEW, RETURN]
    LinkageStatus:
      type: string
      enum: [LINKED, LINKAGE_PENDING]
    ClassificationStatus:
      type: string
      enum: [QUEUED, IN_PROGRESS, COMPLETED, RETRYABLE_FAILED, TERMINAL_FAILED, NEEDS_REVIEW]
    IncidentSeverity:
      type: string
      enum: [MEDIUM, HIGH, CRITICAL]
    IncidentStatus:
      type: string
      enum: [NEW, ACKNOWLEDGED, INVESTIGATING, RESOLVED, REOPENED]
    NotificationStatus:
      type: string
      enum: [QUEUED, SENDING, ACCEPTED, FAILED, DELIVERED, BOUNCED, OUTCOME_UNKNOWN, BLOCKED_NO_ROUTE]
    UploadKind:
      type: string
      enum: [REVIEWS, RETURNS, PRODUCT_REFERENCE, SUPPLIER_REFERENCE, BATCH_REFERENCE]
    ImportProcessingMode:
      type: string
      enum: [HISTORICAL_BATCH, INCREMENTAL_RESPONSES]
    PreviewState:
      type: string
      enum: [READY, INVALID, CONFIRMED, EXPIRED]
    PreviewRowStatus:
      type: string
      enum: [ACCEPTED, REJECTED, DUPLICATE_NOOP, CONFLICT]
    IngestionJobStatus:
      type: string
      enum: [QUEUED, RUNNING, COMPLETED, PARTIAL, FAILED]
    BackgroundJobType:
      type: string
      enum: [INGESTION, CLASSIFICATION, BATCH_POLL, DETECTION, RECONCILIATION]
    BackgroundJobStatus:
      type: string
      enum: [QUEUED, RUNNING, RETRY_WAIT, COMPLETED, PARTIAL, FAILED]
    TrendMetric:
      type: string
      enum: [defect_complaints, defect_category_breakdown, top_affected_products, supplier_batch_comparison, returns_by_reason, severity_distribution]
    RetryEligibility:
      type: object
      required: [eligible, reason_code]
      properties:
        eligible:
          type: boolean
          description: Advisory result for display only; retry commands always re-evaluate eligibility on the server.
        reason_code:
          type: string
          enum: [ELIGIBLE, NOT_FAILED, WORK_IN_PROGRESS, NO_RETRYABLE_WORK, BLOCKING_CAUSE_UNRESOLVED, RETRY_POLICY_BLOCKED, PERMANENT_FAILURE, OUTCOME_UNKNOWN, NOT_RETRYABLE]
          description: Stable safe reason. ELIGIBLE is used only when eligible is true; all other codes are used only when false. No raw provider/configuration detail is included.
      additionalProperties: false
    ApiProblem:
      type: object
      required: [type, title, status, code, detail, request_id]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        detail:
          type: string
          description: Safe explanation; exclude raw feedback, secrets, paths, and provider payloads.
        instance:
          type: string
          format: uri-reference
        request_id:
          type: string
        retry_eligibility:
          $ref: '#/components/schemas/RetryEligibility'
          description: Present only on a retry 409 to return the current safe eligibility result.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
      additionalProperties: false
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
      additionalProperties: false
    PageMeta:
      type: object
      required: [page, page_size, total_items, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total_items:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
      additionalProperties: false
    HealthResponse:
      type: object
      required: [status, checked_at]
      properties:
        status:
          type: string
          const: healthy
        checked_at:
          type: string
          format: date-time
      additionalProperties: false
    ReadinessDetection:
      type: object
      required: [activation_state, coverage_state]
      properties:
        activation_state:
          type: string
          enum: [ACTIVE, INACTIVE, UNKNOWN]
          description: Backend activation state; UNKNOWN is returned when the backend cannot reliably determine activation status and is never ACTIVE, a healthy state, or evidence of zero product defects. ACTIVE is reported only after its required approvals and activation checks succeed. INACTIVE is not evidence of zero defects.
        coverage_state:
          type: string
          enum: [SUFFICIENT, INSUFFICIENT, UNKNOWN]
          description: Coarse current monitoring coverage state. UNKNOWN is not zero coverage and must not be rendered as low risk.
      additionalProperties: false
    ReadinessNotifications:
      type: object
      required: [automatic_activation_state, manual_confirmation_state, email_provider_state]
      properties:
        automatic_activation_state:
          type: string
          enum: [ACTIVE, INACTIVE, UNKNOWN]
          description: Whether automatic notification activation is approved and enabled. UNKNOWN is returned when the backend cannot reliably determine activation status and is never ACTIVE, a healthy state, or evidence of zero product defects. This state does not guarantee provider acceptance or delivery.
        manual_confirmation_state:
          type: string
          enum: [ENABLED, DISABLED, UNKNOWN]
          description: Coarse availability of the approved manual confirmation path; this is not an authorization grant.
        email_provider_state:
          type: string
          enum: [AVAILABLE, UNAVAILABLE, UNKNOWN]
          description: Coarse provider availability only. Does not identify the provider, disclose configuration, or guarantee a send/delivery outcome.
      additionalProperties: false
    ReadinessResponse:
      type: object
      required: [generated_at, detection, processing_state, notifications]
      properties:
        generated_at:
          type: string
          format: date-time
        detection:
          $ref: '#/components/schemas/ReadinessDetection'
        processing_state:
          type: string
          enum: [HEALTHY, DEGRADED, UNKNOWN]
          description: Coarse backend processing state. Use UNKNOWN until the backend can reliably determine current processing health; UNKNOWN is not HEALTHY and is not evidence of zero product defects.
        notifications:
          $ref: '#/components/schemas/ReadinessNotifications'
      additionalProperties: false
    User:
      type: object
      required: [user_id, email, role, status, must_change_password, created_at, updated_at]
      properties:
        user_id:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        must_change_password:
          type: boolean
          description: True for a temporary initial/reset password until changed; normal application routes are blocked.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deactivated_at:
          type: [string, 'null']
          format: date-time
      additionalProperties: false
    PreLoginCsrfResponse:
      type: object
      required: [csrf_token]
      properties:
        csrf_token:
          type: string
          description: Pre-login CSRF value; retain in memory only and send in X-CSRF-Token.
      additionalProperties: false
    PasswordChangeRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        new_password:
          type: string
          minLength: 15
          maxLength: 128
          writeOnly: true
          description: Unicode NFC-normalized policy; spaces/Unicode allowed; common/compromised-password blocklist applies.
      additionalProperties: false
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
      additionalProperties: false
    LoginResponse:
      type: object
      required: [user, csrf_token]
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrf_token:
          type: string
          description: Session-bound CSRF value, not an authentication token.
      additionalProperties: false
    KpiValue:
      type: object
      required: [value, unit, definition_status]
      properties:
        value:
          type: [number, 'null']
        unit:
          type: string
          enum: [feedback_records, return_records, returned_units, incidents, products, fraction]
        definition_status:
          type: string
          enum: [DEFINED_BY_PRD, PROVISIONAL, PENDING_DEFINITION]
        numerator:
          type: [integer, 'null']
          minimum: 0
        denominator:
          type: [integer, 'null']
          minimum: 0
      additionalProperties: false
    DashboardKpis:
      type: object
      required: [feedback_records_analyzed, classification_coverage, unique_defect_feedback_records, return_records, returned_units, active_warnings, critical_warnings, products_at_risk]
      properties:
        feedback_records_analyzed:
          $ref: '#/components/schemas/KpiValue'
        classification_coverage:
          $ref: '#/components/schemas/KpiValue'
        unique_defect_feedback_records:
          $ref: '#/components/schemas/KpiValue'
        return_records:
          $ref: '#/components/schemas/KpiValue'
        returned_units:
          $ref: '#/components/schemas/KpiValue'
        active_warnings:
          $ref: '#/components/schemas/KpiValue'
        critical_warnings:
          $ref: '#/components/schemas/KpiValue'
        products_at_risk:
          $ref: '#/components/schemas/KpiValue'
      additionalProperties: false
    DashboardFilters:
      type: object
      properties:
        from_utc:
          type: [string, 'null']
          format: date-time
        to_utc:
          type: [string, 'null']
          format: date-time
        product_id:
          type: [string, 'null']
        category_code:
          type: [string, 'null']
        supplier_id:
          type: [string, 'null']
        batch_id:
          type: [string, 'null']
        logical_defect_id:
          type: [string, 'null']
        severity:
          oneOf:
            - $ref: '#/components/schemas/IncidentSeverity'
            - type: 'null'
        incident_status:
          oneOf:
            - $ref: '#/components/schemas/IncidentStatus'
            - type: 'null'
        source_type:
          oneOf:
            - $ref: '#/components/schemas/SourceType'
            - type: 'null'
      additionalProperties: false
    DashboardFreshness:
      type: object
      required: [queued_jobs, running_jobs, failed_jobs, stale, coverage_status, windows_awaiting_coverage]
      properties:
        last_successful_import_at:
          type: [string, 'null']
          format: date-time
        last_successful_classification_at:
          type: [string, 'null']
          format: date-time
        last_detection_recomputation_at:
          type: [string, 'null']
          format: date-time
        queued_jobs:
          type: integer
          minimum: 0
        running_jobs:
          type: integer
          minimum: 0
        failed_jobs:
          type: integer
          minimum: 0
        oldest_queued_at:
          type: [string, 'null']
          format: date-time
        stale:
          type: boolean
          description: The staleness threshold is an operational configuration not fixed here.
        coverage_status:
          type: string
          enum: [SUFFICIENT, INSUFFICIENT, UNKNOWN]
        windows_awaiting_coverage:
          type: integer
          minimum: 0
      additionalProperties: false
    DashboardSummary:
      type: object
      required: [generated_at, applied_filters, kpis, freshness]
      properties:
        generated_at:
          type: string
          format: date-time
        applied_filters:
          $ref: '#/components/schemas/DashboardFilters'
        kpis:
          $ref: '#/components/schemas/DashboardKpis'
        freshness:
          $ref: '#/components/schemas/DashboardFreshness'
      additionalProperties: false
    TrendPoint:
      type: object
      required: [bucket_start_utc, bucket_end_utc, value, coverage_state, linkage_status]
      properties:
        bucket_start_utc:
          type: string
          format: date-time
        bucket_end_utc:
          type: string
          format: date-time
        series_key:
          type: [string, 'null']
        series_label:
          type: [string, 'null']
        value:
          type: integer
          minimum: 0
          description: Count in its unit; no unsupported failure rate.
        unit:
          type: string
          enum: [feedback_records, return_records, returned_units, incidents, products]
        coverage_state:
          type: string
          enum: [SUFFICIENT_NONZERO, SUFFICIENT_ZERO, INSUFFICIENT, UNKNOWN, NOT_APPLICABLE]
        linkage_status:
          type: string
          enum: [LINKED, LINKAGE_PENDING, MIXED, NOT_APPLICABLE]
      additionalProperties: false
    TrendResponse:
      type: object
      required: [metric, bucket, unit, timezone, applied_filters, points]
      properties:
        metric:
          $ref: '#/components/schemas/TrendMetric'
        bucket:
          type: string
          enum: [day, week]
        unit:
          type: string
          enum: [feedback_records, return_records, returned_units, incidents, products]
        timezone:
          type: string
          const: UTC
        applied_filters:
          $ref: '#/components/schemas/DashboardFilters'
        points:
          type: array
          items:
            $ref: '#/components/schemas/TrendPoint'
      additionalProperties: false
    ProductSummary:
      type: object
      description: >
        Derived product counts. defect_feedback_count counts distinct fully linked feedback
        records with a completed, validated has_defect=true classification, once per product.
        LINKAGE_PENDING feedback is excluded from that total and is reported separately. Return
        records and known returned units are separate measures. Pending-link counts are labelled
        product analytics only and never imply product-only incidents or automatic notifications.
      required: [product_id, defect_feedback_count, return_record_count, linkage_pending_feedback_count, linkage_pending_defect_feedback_count, linkage_pending_return_record_count]
      properties:
        product_id:
          type: string
        name:
          type: [string, 'null']
        category:
          type: [string, 'null']
        defect_feedback_count:
          type: integer
          minimum: 0
          description: Distinct fully linked feedback source records with a completed, validated defect classification; each record counts once per product.
        return_record_count:
          type: integer
          minimum: 0
          description: Distinct fully linked return source records; not a failure rate.
        returned_units:
          type: [integer, 'null']
          minimum: 0
          description: Sum of known quantities for fully linked return records; null when unavailable.
        linkage_pending_feedback_count:
          type: integer
          minimum: 0
          description: All valid product feedback records whose supplier/batch linkage is pending, regardless of source type or classification outcome.
        linkage_pending_defect_feedback_count:
          type: integer
          minimum: 0
          description: Distinct pending-link feedback records with a completed, validated has_defect=true classification; separate from defect_feedback_count.
        linkage_pending_return_record_count:
          type: integer
          minimum: 0
          description: Distinct pending-link return records, separate from return_record_count.
        linkage_pending_returned_units:
          type: [integer, 'null']
          minimum: 0
          description: Sum of known quantities for pending-link return records; null when unavailable.
      additionalProperties: false
    ProductPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        page:
          $ref: '#/components/schemas/PageMeta'
      additionalProperties: false
    ProductAssociation:
      type: object
      required: [product_id, supplier_id, batch_id, linked_feedback_count]
      properties:
        product_id:
          type: string
        supplier_id:
          type: string
        supplier_name:
          type: [string, 'null']
        batch_id:
          type: string
        linked_feedback_count:
          type: integer
          minimum: 0
      additionalProperties: false
    DefectBreakdown:
      type: object
      description: Product issue breakdown with linked and LINKAGE_PENDING distinct feedback counts kept separate. Pending counts are analytics only and are not incident evidence.
      required: [category_code, category_name, logical_defect_id, display_name, distinct_feedback_count, linkage_pending_distinct_feedback_count]
      properties:
        category_code:
          type: string
        category_name:
          type: string
        logical_defect_id:
          type: string
        display_name:
          type: string
        distinct_feedback_count:
          type: integer
          minimum: 0
          description: Distinct fully linked feedback records for this logical defect.
        linkage_pending_distinct_feedback_count:
          type: integer
          minimum: 0
          description: Distinct LINKAGE_PENDING feedback records for this product and logical defect, shown separately and excluded from incident-capable counts.
        taxonomy_versions:
          type: array
          items:
            type: string
      additionalProperties: false
    ProductDetail:
      type: object
      required: [product, associations, defect_breakdown, generated_at]
      properties:
        product:
          $ref: '#/components/schemas/ProductSummary'
        associations:
          type: array
          items:
            $ref: '#/components/schemas/ProductAssociation'
        defect_breakdown:
          type: array
          items:
            $ref: '#/components/schemas/DefectBreakdown'
        generated_at:
          type: string
          format: date-time
      additionalProperties: false
    ClassificationLabel:
      type: object
      required: [label_role, category_code, category_name]
      properties:
        label_role:
          type: string
          enum: [PRIMARY, SECONDARY]
        category_code:
          type: string
        category_name:
          type: string
        specific_issue_code:
          type: [string, 'null']
        logical_defect_id:
          type: [string, 'null']
        display_name:
          type: [string, 'null']
      additionalProperties: false
    ClassificationSummary:
      type: object
      required: [status, taxonomy_version_id, labels]
      properties:
        status:
          $ref: '#/components/schemas/ClassificationStatus'
        has_defect:
          type: [boolean, 'null']
        needs_review:
          type: [boolean, 'null']
        severity_hint:
          type: [string, 'null']
          enum: [low, medium, high, critical, 'null']
          description: Advisory model output; never determines incident severity.
        evidence_excerpt:
          type: [string, 'null']
        taxonomy_version_id:
          type: string
        schema_version:
          type: [string, 'null']
        model_id:
          type: [string, 'null']
        prompt_version:
          type: [string, 'null']
        api_path:
          type: [string, 'null']
          enum: [RESPONSES, BATCH, 'null']
        labels:
          type: array
          maxItems: 2
          description: >-
            Contains no more than one PRIMARY and one SECONDARY label. A validated
            classification has exactly one PRIMARY and may have one SECONDARY;
            statuses without a validated result may have no labels. The backend
            enforces role uniqueness, duplicate-label rejection, and the outcome
            matrix.
          items:
            $ref: '#/components/schemas/ClassificationLabel'
        error_code:
          type: [string, 'null']
      additionalProperties: false
    FeedbackLineage:
      type: object
      required: [record_origin, ingested_at]
      properties:
        record_origin:
          type: string
          enum: [CSV_UPLOAD, SYNTHETIC_SEED]
        ingestion_job_id:
          type: [string, 'null']
        preview_id:
          type: [string, 'null']
        row_number:
          type: [integer, 'null']
          minimum: 1
        file_sha256:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
        uploaded_by:
          oneOf:
            - $ref: '#/components/schemas/User'
            - type: 'null'
        seed_manifest_ref:
          type: [string, 'null']
        ingested_at:
          type: string
          format: date-time
      additionalProperties: false
    FeedbackSummary:
      type: object
      required: [feedback_id, source_type, source_record_id, product_id, linkage_status, event_time_utc, ingested_at]
      properties:
        feedback_id:
          type: string
        source_type:
          $ref: '#/components/schemas/SourceType'
        source_record_id:
          type: string
        product_id:
          type: string
        supplier_id:
          type: [string, 'null']
        batch_id:
          type: [string, 'null']
        reported_supplier_id:
          type: [string, 'null']
        reported_batch_id:
          type: [string, 'null']
        linkage_status:
          $ref: '#/components/schemas/LinkageStatus'
        event_time_utc:
          type: string
          format: date-time
        ingested_at:
          type: string
          format: date-time
        classification:
          oneOf:
            - $ref: '#/components/schemas/ClassificationSummary'
            - type: 'null'
      additionalProperties: false
    FeedbackDetail:
      type: object
      required: [feedback_id, source_type, source_record_id, product_id, linkage_status, event_time_utc, ingested_at, feedback_text, lineage, linked_incident_ids]
      properties:
        feedback_id:
          type: string
        source_type:
          $ref: '#/components/schemas/SourceType'
        source_record_id:
          type: string
        product_id:
          type: string
        supplier_id:
          type: [string, 'null']
        batch_id:
          type: [string, 'null']
        reported_supplier_id:
          type: [string, 'null']
        reported_batch_id:
          type: [string, 'null']
        linkage_status:
          $ref: '#/components/schemas/LinkageStatus'
        event_time_utc:
          type: string
          format: date-time
        ingested_at:
          type: string
          format: date-time
        feedback_text:
          type: string
        rating:
          type: [integer, 'null']
          minimum: 1
          maximum: 5
        source_label:
          type: [string, 'null']
        return_quantity:
          type: [integer, 'null']
          minimum: 1
        return_category:
          type: [string, 'null']
        classification:
          oneOf:
            - $ref: '#/components/schemas/ClassificationSummary'
            - type: 'null'
        lineage:
          $ref: '#/components/schemas/FeedbackLineage'
        linked_incident_ids:
          type: array
          items:
            type: string
      additionalProperties: false
    FeedbackPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeedbackSummary'
        page:
          $ref: '#/components/schemas/PageMeta'
      additionalProperties: false
    Incident:
      type: object
      required: [incident_id, cluster_id, severity, status, first_detected_at, last_seen_at, created_at, updated_at, product_id, supplier_id, batch_id, logical_defect_id]
      properties:
        incident_id:
          type: string
        cluster_id:
          type: string
        previous_episode_id:
          type: [string, 'null']
        severity:
          $ref: '#/components/schemas/IncidentSeverity'
        status:
          $ref: '#/components/schemas/IncidentStatus'
        first_detected_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        resolved_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        product_id:
          type: string
        product_name:
          type: [string, 'null']
        supplier_id:
          type: string
        supplier_name:
          type: [string, 'null']
        batch_id:
          type: string
        logical_defect_id:
          type: string
        defect_display_name:
          type: [string, 'null']
      additionalProperties: false
    IncidentPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Incident'
        page:
          $ref: '#/components/schemas/PageMeta'
      additionalProperties: false
    ThresholdCriterion:
      type: object
      required: [metric, operator, configured_value, observed_value, unit]
      properties:
        metric:
          type: string
          enum: [observed_count, baseline_28d_count, normalized_baseline_7d, observed_to_baseline_ratio]
        operator:
          type: string
          enum: [gte, gt, eq]
        configured_value:
          type: number
        observed_value:
          type: number
        unit:
          type: string
          enum: [feedback_records, ratio, feedback_records_per_7_days]
      additionalProperties: false
    TimeWindow:
      type: object
