        blank records. Unsupported extensions return 415; oversized files return
        413; row-limit excess or malformed file-level structure returns 422 and
        creates no preview. Parseable row-level errors are recorded in the
        immutable preview. Parser contract versions are selected by upload kind.
        The preview binds the exact staged-byte SHA-256, parser version, canonical
        mapping snapshot, and row outcomes/counts. Reusing Idempotency-Key with
        the same canonical request returns the original preview; changed request
        content with that key returns 409. A new key creates a new immutable
        preview. No source feedback or ingestion job is committed before
