  /incidents/{incident_id}/status:
    post:
      operationId: transitionIncident
      tags: [Incidents]
      summary: Apply one permitted incident status transition
      description: >
        Allowed sequence: NEW to ACKNOWLEDGED to INVESTIGATING to RESOLVED;
        RESOLVED to REOPENED to INVESTIGATING. The server validates the
        transition and expected current state. A qualifying recurrence may
        reopen the same incident within 30 days or create a linked episode
        later. A transition that triggers a notification persists incident
        state and outbox intent atomically before any provider call.
      security:
        - sessionCookie: []
          csrfToken: []
      x-required-roles: [ADMIN, BUSINESS_USER]
      x-prd-requirements: [F13, F17, PRD 9.3, PRD 10.1]
      x-acceptance-criteria: [AC10, AC11, AC15, AC22]
      parameters:
        - $ref: '#/components/parameters/IncidentIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentTransitionRequest'
            example:
              target_status: ACKNOWLEDGED
              expected_status: NEW
              expected_updated_at: '2026-11-21T08:00:00Z'
      responses:
        '200':
          description: Transition applied or replayed for the same idempotency key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentActionResponse'
              example:
                incident:
                  incident_id: inc_01
                  cluster_id: clu_01
                  severity: HIGH
                  status: ACKNOWLEDGED
                  first_detected_at: '2026-11-21T07:00:00Z'
                  last_seen_at: '2026-11-21T07:55:00Z'
                  resolved_at: null
                  created_at: '2026-11-21T07:00:00Z'
                  updated_at: '2026-11-21T08:01:00Z'
                  product_id: P1001
                  supplier_id: SUP01
                  batch_id: B101
                  logical_defect_id: zipper_failure
                event:
                  incident_event_id: iev_01
                  incident_id: inc_01
                  event_type: STATUS_CHANGED
                  status_before: NEW
                  status_after: ACKNOWLEDGED
                  created_at: '2026-11-21T08:01:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
