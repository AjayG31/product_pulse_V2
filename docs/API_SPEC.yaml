        QUEUED with attempt_count 0 and max_attempts 3 (total claimed attempts,
        including the initial attempt), per the scoped OPS-02 clarification.
        Queue creation does not make a provider call; downstream worker execution
        is outside this confirmation request. A different mode on repeat confirmation
        conflicts. Reference-data previews omit processing_mode. INVALID or
        EXPIRED previews cannot be confirmed. A preview with a missing required
        mapping also cannot be confirmed. No client path is accepted. Business
