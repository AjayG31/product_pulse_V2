openapi: 3.1.0
info:
  title: ProductPulse REST API
  version: 1.5.2
  summary: Approved Design Baseline with PP-003/PP-004, PP-014 queue-attempt snapshot, and PP-007 worker/SQLite policies recorded; remaining calibration and deployment-specific dependencies stay conditional.
  description: |
    Conditional design baseline updated on 22 November 2026, based on PRD v1.7,
    Decision Register v2.0, Tech Stack v1.2.0, Architecture v1.5, and Data Model v1.5.2
    (Approved — Design Baseline; conditional implementation dependencies remain),
    Detection Specification v1.1 (draft clarification), Alert Specification v0.3
    (draft), and AI_SPEC v1.0. This conditional approval does not resolve other
    decisions marked Pending Calibration, Proposed, or Open and does not authorize
    activation of detection, notifications, or other functionality whose
    prerequisites remain unresolved.
    Event-time filters and timestamps use UTC. The API is the authorization
    boundary. OpenAI and email-provider calls are backend-only. No endpoint
    accepts or returns filesystem paths, credentials, or API keys.
  contact:
    name: ProductPulse API contract
  license:
    name: Internal project specification
    identifier: LicenseRef-ProductPulse
servers:
  - url: /
    description: Same-origin API; deployment host and API version prefix are not selected.
tags:
  - name: Authentication
    description: Secure email/password login and server-side session lifecycle.
  - name: Dashboard
    description: Filtered KPI, trend, and freshness reads.
  - name: Readiness
    description: Coarse, read-only readiness states visible to authenticated Admin and Business User roles.
  - name: Products
    description: Product quality summaries and linked supplier/batch detail.
  - name: Feedback
    description: Read-only customer feedback exploration and source lineage.
  - name: Incidents
    description: Warning detail, evidence, lifecycle actions, notes, and history.
  - name: Detection
    description: Read-only deterministic detection-result rationale and coverage.
  - name: Notifications
    description: Approved-recipient manual preview/confirmation and delivery history.
  - name: Ingestion
    description: Admin-only CSV templates, preview, confirmation, jobs, and reports.
  - name: Processing
    description: Admin-only durable background job monitoring and retry.
  - name: Reconciliation
    description: Admin review of conflicts and explicit source-link correction.
  - name: Administration
    description: Admin-managed users, taxonomy, detection rules, and notification directory.
  - name: Operations
    description: Public coarse health and Admin operational/audit summaries.
security:
  - sessionCookie: []
