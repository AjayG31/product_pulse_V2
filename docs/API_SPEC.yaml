x-contract-decisions:
  approved-behavior:
    - Admin and Business User are the only MVP roles; authorization is enforced by the backend on every protected operation.
    - Upload, preview, confirmation, ingestion retry, configuration, reconciliation, and detailed operations are Admin-only.
    - Every confirmed review/return import has an explicit Admin-selected processing mode: HISTORICAL_BATCH or INCREMENTAL_RESPONSES. Newly persisted eligible feedback is automatically queued through the corresponding OpenAI API; reference imports have no mode. Retries preserve the mode.
    - A validated classification has one PRIMARY label and at most one SECONDARY label; the API response array contains no more than two labels, and the backend enforces role uniqueness and classification-state invariants.
    - Preview identity is immutable and confirmation is bound to the verified SHA-256 of the staged bytes.
    - Authenticated GET /readiness is read-only and exposes coarse readiness to Admin and Business User roles. UNKNOWN is returned when the backend cannot reliably determine a readiness status and is never interpreted as ACTIVE, HEALTHY, or evidence of zero product defects. INACTIVE detection is not zero defects; secrets and Admin-only configuration are excluded. Readiness does not authorize actions or activate detection/notifications.
    - Admins map CSV source columns to required and optional canonical targets. Each required target appears exactly once, no target is used by two source columns, optional source columns may be marked IGNORE, missing required mappings block confirmation, and any mapping/file change requires a new validated preview bound to its immutable preview identity and verified file hash. Business Users cannot access ingestion or mapping.
    - Identical source identity and payload is a no-op; changed payload is a visible conflict and never overwrites original feedback.
    - LINKAGE_PENDING records may appear in clearly labelled product analytics when product identity is valid; they cannot create product-only incidents or automatic notifications.
    - Detection-result responses expose deterministic NO_TRIGGER and INSUFFICIENT_COVERAGE rationale to ADMIN and BUSINESS_USER roles through a read-only paginated endpoint.
    - A detection-result fingerprint includes the classification-completeness assessment, relevant classification state, and coverage-policy version.
    - Historical recomputations do not apply incident changes or create automatic notifications; only qualifying current monitoring results may be applied.
    - Same-severity automatic notification cooldown is fixed at 86400 seconds per incident and severity, shared across all MVP routes; request bodies cannot override it. Higher-severity escalation bypasses the cooldown.
    - A cooldown suppression retains the incident update and appends an auditable SYSTEM_DECISION event; it creates no delivery attempt.
    - Non-definitive classifications are excluded from confirmed defect counts; DAI-06 coverage policy determines whether source/classification completeness is sufficient. Automatic detection remains disabled until required coverage policy and calibration are approved.
    - Sandbox/provider unavailability does not suppress qualifying incident creation or its required durable outbox event; delivery failure is handled independently.
    - Admin retry is restricted to eligible known-failed notifications, preserves the event identity, writes a new queued attempt, and is idempotent. OUTCOME_UNKNOWN is not automatically resent without provider verification or an approved policy.
    - Audit before/after snapshots are limited to the safe allow-list schema and cannot contain feedback, credentials, email addresses, arbitrary message content, or provider payloads.
    - Incident transitions and notes are append-only and auditable; stale concurrent transitions return 409.
    - Manual notifications require preview and explicit confirmation, approved directory recipients, and an idempotency key.
    - The API and one worker share one SQLite database; artifact bytes are resolved only by backend code from opaque identifiers.
    - Authentication uses Argon2id/argon2-cffi (19 MiB, 2 iterations, parallelism 1), the approved NFC 15-128 code-point policy, 30-minute idle/8-hour absolute sessions, concurrent sessions, and the host-only __Host-productpulse_session cookie.
    - GET /auth/csrf bootstraps a 10-minute pre-login CSRF cookie/token; login validates matching cookie/header and exact same-origin Origin/Referer. Session mutations require session-bound CSRF; production CORS is same-origin.
    - First Admin setup is one-time and protected. Admin-created/reset temporary passwords require change before normal use; reset/deactivation/change revokes sessions. Email normalization and login throttles follow the approved SEC-01/02 contract.
    - CSV uploads are capped at 20,000,000 bytes and 50,000 logical data records; strict UTF-8 permits one leading BOM; five parser-contract versions, offset-aware millisecond UTC timestamps, exact IDs, and field limits follow DAI-01.
    - DAI-02 preserves source rows: identical payloads are no-ops, changed payloads conflict and never overwrite. Reference conflicts use explicit KEEP_EXISTING, DISMISS, or guarded APPLY_INCOMING_REFERENCE with stale-state 409.
    - Preview idempotency keys bind to request fingerprints; previews bind exact bytes/hash, parser version, mappings, and outcomes. Rejection reports are protected formula-safe UTF-8 CSV for rejected/conflicting rows only, excluding raw feedback and duplicate no-ops.
  pending-or-open:


    - Exact readiness degradation thresholds and provider-health assessment parameters remain pending for the operations specification. Until readiness can be established using approved assessment parameters, the endpoint returns UNKNOWN.
    - OPS-03 retains synthetic uploads, previews, row reasons, rejection reports, and audit evidence through the capstone period without automatic per-artifact expiry. Cleanup is limited to documented synthetic reset/reseed after coherent backup and reference/audit checks. Deployment-specific backup cadence and backup retention remain open.
    - Coverage declaration writes are not exposed; seed/worker ownership and a future Admin declaration contract depend on DAI-06 scope and completeness decisions.
    - F16 evaluation datasets/reports, local verification and pre-merge checklist evidence (AC17), and rollback/health-check results (AC18), remain external engineering evidence; the API exposes no runtime endpoint for them.
    - PB-01 detection thresholds and minimum counts remain Pending Calibration; this contract sets no default values.
    - DAI-06 coverage scope vocabulary and completeness/calibration rules remain Pending Calibration.
    - Cooldown timestamp anchor and same-severity re-crossing/severity-decrease edge cases remain pending clarification in ALERT_SPEC.md.
    - PB-05 definitions for active warnings, critical warnings, and products at risk remain unresolved; affected KPI values may be null with PENDING_DEFINITION.
    - Notification routing precedence, fallback directory, sink/provider, provider verification for uncertain sends, and external idempotency remain open. Expired SENDING claims with no started attempt return to QUEUED; abandoned IN_PROGRESS attempts become OUTCOME_UNKNOWN and are not automatically resent.

    - PP-007 approves a 5-second SQLite busy timeout with 2 additional `SQLITE_BUSY` retries after rollback; a 5-minute worker lease renewed every 60 seconds; 5-second worker polling; 60-second reconciliation; and 5/15/45-second eligible retry delays. PP-014-created classification work remains limited to 3 total attempts. Other work-type attempt budgets and provider-specific notification retry limits remain unresolved; the latter, routing, sink selection, and external idempotency remain gated under PP-008. Deployment-specific periodic backup cadence and backup retention remain open. Non-login route rate limits and API versioning are unaffected.
    - GET /incidents exposes its documented filter subset; category_code and source_type are not incident filters. The UI must visibly mark them as unapplied to incident rows, as allowed by PRD §6.2.
    - Taxonomy defaults are not approved by examples in the PRD; no taxonomy seed content is prescribed here.
  proposed-contract-details-for-review:


    - Manual preview returns an opaque actor-bound preview token; confirming a token creates at most one outbox event.
    - Admin job/notification response retry_eligibility values are safe, server-derived display hints; retry commands always re-evaluate eligibility.
    - Paginated lists use page and page_size, with stable sort tie-breaks by primary identifier.
    - Date filters use inclusive from_utc and exclusive to_utc; page defaults/ranges and Idempotency-Key length bounds are practical contract proposals.

    - Manual preview token design, retry reason-code details, and several response shapes remain subject to their owning specifications.
    - Retry eligibility fields are Admin-only projections; retry commands still perform authoritative server-side checks.
x-authentication-contract:
  password:
    algorithm: Argon2id
    implementation: argon2-cffi
    memory_kib: 19456
    iterations: 2
    parallelism: 1
    policy:
      normalization: Unicode NFC before validation/hash/verification
      min_code_points: 15
      max_code_points: 128
      allow_spaces_and_unicode: true
      reject_overlength_without_truncation: true
      block_common_or_compromised_passwords: true
      composition_rules: none
      periodic_expiry: none
    rehash_on_successful_login: true
    benchmark_rule: Increase parameters if practical; never silently lower approved cost.
  email_identity:
    display_value: Trim outer ASCII whitespace and preserve entered casing.
    normalized_value: Trim outer ASCII whitespace, Unicode NFC, lowercase IDNA ASCII domain, then case-fold the full address.
    alias_rewriting: none
  session:
    idle_seconds: 1800
    absolute_seconds: 28800
    concurrent_sessions: allowed
    token_storage: Store only a one-way hash of the opaque bearer.
    rotate_on: [login, password_reset, password_change]
  session_cookie:
    name: __Host-productpulse_session
    secure: true
    http_only: true
    same_site: Lax
    path: /
    domain: absent
    expiry: No later than the remaining idle or absolute deadline.
  csrf:
    bootstrap_endpoint: GET /auth/csrf
    prelogin_cookie: __Host-productpulse_prelogin_csrf
    prelogin_cookie_attributes: [Secure, HttpOnly, SameSite=Strict, Path=/, no Domain]
    prelogin_max_age_seconds: 600
    login_requires_matching_cookie_and_header: true
    origin_policy: Exact same-origin Origin; Referer only if Origin is absent.
    session_token: Bind to server-side session; rotate on login/reset/change; require on every cookie-authenticated mutation.
  cors:
    production: same-origin only
    cross_origin_credentials: disabled
  account_lifecycle:
    first_admin: One-time protected command, hidden prompt, fails if Admin already exists; never accept password via argv/environment/history/logs.
    roles: [ADMIN, BUSINESS_USER]
    deactivation: Revoke all active sessions atomically; no delete/reactivation.
    recovery: Admin-assisted temporary password only; direct verified in-person handoff outside ProductPulse; force change before normal use; no recovery email.
    password_change: Revoke existing sessions and establish one fresh session with rotated CSRF.
  login_rate_limits:
    failed_attempts_per_normalized_account: 10
    account_window_seconds: 900
    account_cooldown_seconds: 900
    attempts_per_source_ip: 60
    ip_window_seconds: 900
    scope: login only
    response: Generic failure; 429 includes Retry-After and does not disclose account existence.
  security_events:
    audit: [LOGIN_SUCCEEDED, LOGOUT, ACCOUNT_CREATED, ACCOUNT_DEACTIVATED, PASSWORD_RESET, PASSWORD_CHANGED, SESSION_REVOKED, AUTHORIZATION_DENIED]
    failed_login_and_throttle: Restricted redacted security log; no email/IP/password/token/raw body.
    audit_snapshot_exclusions: [email, password, password_hash, session_id, session_token, csrf_token, recovery_token, source_ip, provider_secret, raw_feedback, raw_request_body]
x-csv-input-contract:
  file_part_limit_bytes: 20000000
  file_limit_interpretation: Decimal 20 MB, inclusive; enforce while streaming before parse.
  data_row_limit: 50000
  row_counting: Logical CSV data records after one header; blank records count.
  encoding: UTF-8 strict
  bom: One optional UTF-8 BOM at byte offset zero; strip it before parsing the first header.
  csv_dialect: RFC-4180-style; reject malformed file-level structure before creating preview.
  parser_contract_versions:
    REVIEWS: reviews-v1
    RETURNS: returns-v1
    PRODUCT_REFERENCE: product-reference-v1
    SUPPLIER_REFERENCE: supplier-reference-v1
    BATCH_REFERENCE: batch-reference-v1
  parser_versioning: Increment the relevant contract version when parse, validation, or normalization semantics change.
  timestamp:
    accepted_format: RFC 3339/ISO-8601 with Z or explicit offset
    timezone_offset_required: true
    maximum_fractional_digits: 3
    normalize_to: UTC fixed milliseconds
    reject_offset_free_or_excess_precision: true
    do_not_guess_or_round: true
  field_limits:
    feedback_text_code_points: 16384
    identifier_code_points: 256
    other_mapped_text_code_points: 1024
    decoded_field_utf8_bytes: 65536
    truncation: forbidden
  source_identity:
    uniqueness: Global pair of source_type and source_record_id.
    normalization: Preserve exact decoded Unicode code points; case-sensitive; no trim, case-fold, or Unicode normalization.
    reject: [empty, whitespace_only, leading_or_trailing_whitespace]
    identical_payload: DUPLICATE_NOOP; do not create a second source record.
    changed_payload: SOURCE_PAYLOAD conflict; never overwrite original source text or event time.
    within_file: First valid row is candidate; later identical payload is DUPLICATE_NOOP; later different payload is CONFLICT.
    payload_hash: SHA-256 of canonical validated fields after timestamp normalization; preserve source text and IDs exactly.
  linkage:
    precedence: Use valid identifiers supplied in feedback row first; otherwise use explicit imported reference data as approved by DAI-01.
    unresolved: Preserve otherwise-valid rows as LINKAGE_PENDING; label product-level analytics only when product_id is valid; create no product-only incident or automatic notification.
    conflict: Conflicting mappings are surfaced for Admin review and are never last-write-wins.
  reference_conflicts:
    KEEP_EXISTING: Mark reviewed/resolved with no data change.
    DISMISS: Mark dismissed with no data change.
    APPLY_INCOMING_REFERENCE: Apply only validated incoming fields when expected existing-value hash matches; apply atomically and audit before/after provenance; stale state returns 409.
    source_payload_apply: forbidden
  column_mapping:
    description: Admin-submitted and server-validated under DAI-08.
    unit: One mapping per source-column index and exact header text in uploaded file.
    target: Map each source column to one canonical field allowed for upload_kind; optional source columns may be marked IGNORE.
    required_fields: Every required canonical target in selected template must be mapped exactly once.
    uniqueness: No target is mapped by two source columns; source-column index appears once.
    confirmation: Missing required mapping blocks confirmation and job creation.
    persistence: Immutable mapping snapshot bound to preview and exact verified file hash; changed file/mapping requires new preview.
  preview_integrity:
    idempotency: Same Idempotency-Key and canonical request returns original preview; same key with changed request returns 409; a new key creates a new immutable preview.
    request_fingerprint: SHA-256 of upload_kind, exact staged-byte SHA-256, and canonical mapping snapshot.
    immutable_binding: [exact staged bytes/hash, parser_contract_version, canonical mapping snapshot, row outcomes/counts]
    confirmation: Re-read and re-hash staged bytes; any mismatch fails closed.
    state: READY when at least one eligible new row exists; INVALID when none are eligible.
    malformed_file: 422 without creating a preview.
    file_too_large: 413.
    row_limit_exceeded: 422.
  rejection_report:
    content_type: text/csv; charset=utf-8
    rows: [REJECTED, CONFLICT]
    excluded_rows: [DUPLICATE_NOOP]
    columns: [row_number, outcome, source_type_if_parsed, source_record_id_if_parsed, stable_reason_code, safe_explanation]
    raw_feedback: excluded
    formula_safety: Escape formula-leading user-controlled values.
    available_only_when_rejections_or_conflicts_exist: true
    artifact_expiry_retention: Retain synthetic artifacts through the capstone period with no automatic per-artifact expiry; cleanup only through documented synthetic reset/reseed after backup and reference/audit checks.
  templates:
    REVIEWS:
      required_headers: [review_id, product_id, supplier_id, batch_id, review_timestamp, review_text]
      required_values: [review_id, product_id, review_timestamp, review_text]
      mapping_resolvable_blank_values: [supplier_id, batch_id]
      optional_headers: [rating, source]
      constraints:
        rating: Integer from 1 through 5 when present.
        review_text: Non-empty.
    RETURNS:
      required_headers: [return_id, product_id, supplier_id, batch_id, return_timestamp, return_reason]
      required_values: [return_id, product_id, return_timestamp, return_reason]
      mapping_resolvable_blank_values: [supplier_id, batch_id]
      optional_headers: [return_quantity, return_category]
      constraints:
        return_quantity: Positive integer when present.
        return_reason: Non-empty.
    PRODUCT_REFERENCE:
      required_headers: [product_id]
      optional_headers: [name, category]
    SUPPLIER_REFERENCE:
      required_headers: [supplier_id]
      optional_headers: [name]
    BATCH_REFERENCE:
      required_headers: [batch_id, product_id, supplier_id]
      optional_headers: []
  review-items:
    - Reference rows may establish or update entity values only through explicit reviewed imports; conflicting identifiers are not silently overwritten.
paths:
  /health:
    get:
      operationId: getHealth
      tags: [Operations]
      summary: Check service health
      description: Public deployment probe. Returns only a coarse service state and no dependency details, secrets, paths, or feedback.
      security: []
      x-required-roles: [PUBLIC]
      x-prd-requirements: [F15, PRD 12, PRD 13.1]
      x-acceptance-criteria: [AC16]
      responses:
        '200':
          description: Service is responding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: healthy
                checked_at: '2026-11-21T09:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/InternalServerError'
  /readiness:
    get:
      operationId: getReadiness
      tags: [Readiness]
      summary: Read coarse detection, processing, and notification readiness
      description: >
        Read-only readiness for authenticated Admin and Business User roles.
        Reports detection activation separately from coverage, processing
        degradation, automatic notification activation, manual confirmation
        availability, and email-provider availability. UNKNOWN is returned when
        the backend cannot reliably determine the relevant readiness status;
        it must never be interpreted as ACTIVE, HEALTHY, or evidence of zero
        product defects. This endpoint reveals
        no provider identity, route, recipient/configuration detail, credentials,
        provider payload, or secret and does not authorize any state-changing
        action. INACTIVE detection does not mean zero defects. Exact degradation
        thresholds and provider-health assessment parameters remain pending in
        the operations specification; return UNKNOWN until readiness can be
        established. A ready provider does not prove acceptance or delivery of
        any message.
      x-required-roles: [ADMIN, BUSINESS_USER]
      x-decision-references: [DAI-06, PB-01, ARC-08]
      responses:
        '200':
          description: Coarse readiness states only.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              example:
                generated_at: '2026-11-21T09:00:00Z'
                detection:
                  activation_state: INACTIVE
                  coverage_state: UNKNOWN
                processing_state: UNKNOWN
                notifications:
                  automatic_activation_state: INACTIVE
                  manual_confirmation_state: UNKNOWN
                  email_provider_state: UNKNOWN
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/InternalServerError'
  /auth/csrf:
    get:
      operationId: bootstrapCsrf
      tags: [Authentication]
      summary: Bootstrap pre-login CSRF protection
      description: >
        Sets a host-only Secure, HttpOnly, SameSite=Strict, Path=/ pre-login CSRF
        cookie with Max-Age=600 and returns its matching value for memory-only
        browser use. This is not an authentication token.
      security: []
      x-required-roles: [PUBLIC]
      x-decision-references: [SEC-01]
      responses:
        '200':
          description: Pre-login CSRF token created.
          headers:
            Set-Cookie:
              description: __Host-productpulse_prelogin_csrf with Secure, HttpOnly, SameSite=Strict, Path=/, no Domain, Max-Age=600.
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreLoginCsrfResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/InternalServerError'
  /auth/login:
    post:
      operationId: login
      tags: [Authentication]
      summary: Create an authenticated server-side session
      description: Public login only; no self-registration. Requires the pre-login CSRF cookie/header and exact same-origin Origin/Referer validation. Success sets a Secure, HttpOnly, SameSite=Lax host-only session cookie and returns the public user and session-bound CSRF token, never the session bearer or password hash. A must_change_password account is restricted to session inspection, logout, and password change.
      security: []
      x-required-roles: [PUBLIC]
      x-prd-requirements: [F01, PRD 3.2, PRD 6.1]
      x-acceptance-criteria: [AC01]
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: admin@example.test
              password: <redacted>
      responses:
        '200':
          description: Credentials accepted and session established.
          headers:
            Set-Cookie:
              description: Cookie is __Host-productpulse_session; Secure, HttpOnly, SameSite=Lax, Path=/, host-only, with expiry no later than the remaining 30-minute idle or 8-hour absolute deadline.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                user:
                  user_id: usr_admin_01
                  email: admin@example.test
                  role: ADMIN
                  status: ACTIVE
                  must_change_password: false
                  created_at: '2026-11-20T10:00:00Z'
                  updated_at: '2026-11-20T10:00:00Z'
                csrf_token: <opaque-session-bound-token>
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalServerError'
  /auth/session:
    get:
      operationId: getCurrentSession
      tags: [Authentication]
      summary: Return the current user and CSRF token
      description: Returns the authenticated principal and session-bound CSRF token. Sessions expire after 30 minutes idle or 8 hours absolute; forced-change users may only inspect session, log out, or change password.
      x-required-roles: [ADMIN, BUSINESS_USER]
      x-prd-requirements: [F01, PRD 3.2, PRD 6.1]
      x-acceptance-criteria: [AC01]
      responses:
        '200':
          description: Active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/InternalServerError'
  /auth/logout:
    post:
      operationId: logout
      tags: [Authentication]
      summary: Revoke the current session
      description: Invalidates the server-side session and expires its cookie. Repeating logout after revocation may return 204.
      security:
        - sessionCookie: []
          csrfToken: []
      x-required-roles: [ADMIN, BUSINESS_USER]
      x-prd-requirements: [F01, PRD 6.1]
      x-acceptance-criteria: [AC01]
      responses:
        '204':
          description: Session invalidated.
          headers:
            Set-Cookie:
              description: Expired session cookie.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/InternalServerError'
  /auth/password-change:
    post:
      operationId: changeTemporaryPassword
      tags: [Authentication]
      summary: Change a temporary password
      description: >
        Available only to an authenticated account with must_change_password=true.
        On success, stores the new Argon2id hash, clears the forced-change flag,
        revokes all existing account sessions, and establishes one fresh session
        with rotated cookie and CSRF token. Before completion the account can only
        inspect its session, log out, or call this operation.
      security:
        - sessionCookie: []
          csrfToken: []
      x-required-roles: [ADMIN, BUSINESS_USER]
      x-decision-references: [SEC-01, SEC-02]
      x-prd-requirements: [F01, PRD 3.2, PRD 6.1]
