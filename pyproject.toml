[project]
name = "productpulse"
version = "0.1.0"
description = "ProductPulse application foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.20,<2",
  "argon2-cffi>=25.1,<26",
  "fastapi>=0.165,<1",
  "python-multipart>=0.0.34,<0.1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.54,<1",
]

[dependency-groups]
dev = [
  "bandit>=1.9,<2",
  "httpx>=0.28,<1",
  "pip-audit>=2.9,<3",
  "pytest>=9,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.bandit]
exclude_dirs = ["tests", "migrations"]

